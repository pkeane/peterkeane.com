const POOL=[]; DATA.forEach((d,i)=>d.w.forEach(w=>POOL.push([i,w])));
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function draw(){
  // two words from every vowel first, so all headings show; the rest drawn at random
  const sh=x=>{x=x.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
